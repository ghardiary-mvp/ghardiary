<!DOCTYPE html>
<html>
<head>
<title>Ghar Diary (concept MVP)</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F4F4;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#0F0F0F}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.banner{background:#F2F0FF;color:#3B2A8F;font-size:11px;font-weight:600;padding:8px 14px;text-align:center}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #EFEFEF}
.top .t{font-size:17px;font-weight:700}
.top .chip{margin-left:auto}
.ico{width:36px;height:36px;border-radius:10px;background:#6E42E5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.main{flex:1;padding:16px 18px 28px;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;margin:4px 0 0;text-align:center}
.sub{color:#5C5C5C;font-size:14px;text-align:center;margin:0}
.muted{color:#5C5C5C;font-size:12px;line-height:17px}
textarea{width:100%;min-height:110px;border:1px solid #DADADA;border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical}
.row{display:flex;gap:8px}
.btn{border:none;border-radius:12px;padding:14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;background:#0F0F0F;color:#fff;width:100%;text-align:center;text-decoration:none;display:block}
.btn.sec{background:#fff;color:#0F0F0F;border:1px solid #DADADA}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:10px}
.btn.link{background:none;color:#3B2A8F;padding:6px;font-size:13px}
.btn:disabled{opacity:.5}
.chip{font-size:12px;font-weight:600;background:#F5F5F5;border:none;padding:8px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
.chip.on{background:#0F0F0F;color:#fff}
.card{border:1px solid #EFEFEF;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.card.red{background:#FDEEEE;border-color:#F4C7C7}
.card.violet{background:#F2F0FF;border:none}
.card.grey{background:#F7F7F7;border:none}
.ct{font-size:15px;font-weight:700}
.badge{font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
.b-safe{background:#E7F5EC;color:#1F6B3A}.b-no{background:#fff;color:#8A1C1C}.b-urg{background:#8A1C1C;color:#fff}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:18px}
.step input{margin-top:2px;width:18px;height:18px;flex-shrink:0}
.redtxt{color:#5A1212;font-size:13px;line-height:18px}
.alert{background:#8A1C1C;color:#fff;border-radius:14px;padding:14px;font-size:14px;line-height:20px}
.tabs{display:flex;background:#F2F2F2;border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font:inherit;font-size:12px;font-weight:600;color:#5C5C5C;cursor:pointer}
.tabs button.on{background:#fff;color:#0F0F0F;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid #EFEFEF;font-size:13px}
.item span:last-child{color:#5C5C5C;font-size:11px;text-align:right}
.preview{max-width:100%;max-height:180px;border-radius:12px;object-fit:cover}
.spin{width:28px;height:28px;border:3px solid #E6E6E6;border-top-color:#6E42E5;border-radius:50%;animation:s 1s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
pre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:19px;margin:0}
.hide{display:none!important}
.mic{width:132px;height:132px;border-radius:999px;background:#0F0F0F;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px #F2F0FF;cursor:pointer}
.mic.live{background:#8A1C1C;box-shadow:0 0 0 14px #FDEEEE;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 22px #FDEEEE}}
.stopsq{width:34px;height:34px;border-radius:6px;background:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="banner">Concept MVP for a PM case study · not an Urban Company product · never books or messages anyone</div>
  <div class="top">
    <div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></div>
    <div><div class="muted">for Urban Company customers</div><div class="t">Ghar Diary</div></div>
    <button class="chip top-chip" onclick="go('diary')">My home</button>
  </div>
  <div class="main" id="view"></div>
</div>

<script>
/* ---------- backend ---------- */
var API = 'https://script.google.com/macros/s/AKfycbwSAtdXHTqI58UM0iKPaYztXEh8K6nRcEQu3s5MvrQTi3Zeub7TtL1JcG2VFZRBmikQFg/exec';
var IN_APPS_SCRIPT = !!(window.google && google.script && google.script.run);
function api(action, body, ok, fail) {
  if (IN_APPS_SCRIPT) {
    var r = google.script.run.withSuccessHandler(ok || function () {}).withFailureHandler(fail || function () {});
    if (action === 'diagnose') r.diagnose(body.input); else r.track(body.event, body.data);
    return;
  }
  body.action = action;
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (res) { return res.json(); })
    .then(function (j) { if (ok) ok(j); })
    .catch(function (e) { if (fail) fail(e); });
}

/* ---------- state ---------- */
var S = { session: Math.random().toString(36).slice(2, 10), text: '', img: null, imgMime: null, imgUrl: null, result: null, answers: {}, status: {}, removed: {}, removedChoice: {}, tried: {}, tab: 'room' };
var KEY = 'gharDiary.v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { facts: [], jobs: [] }; } catch (e) { return { facts: [], jobs: [] }; } }
function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
var D = load();

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function track(ev, data) { data = data || {}; data.session = S.session; try { api('track', { event: ev, data: data }); } catch (e) {} }
function today() { return new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
var ROOM = { bathroom: 'Bathroom', kitchen: 'Kitchen', bedroom: 'Bedroom', living_room: 'Living room', balcony: 'Balcony', whole_home: 'Whole home', other: 'Other', unknown: 'Not sure' };
var TRADE = { plumber: 'Plumber', electrician: 'Electrician', carpenter: 'Carpenter', ac: 'AC technician', washing_machine: 'Washing machine technician', other: 'Other' };
function V(html) { document.getElementById('view').innerHTML = html; window.scrollTo(0, 0); }

/* ---------- screens ---------- */
function go(screen) { ({ home: home, loading: loading, result: result, jobs: jobs, brief: brief, diary: diary })[screen](); }

function home() {
  var open = D.jobs.filter(function (j) { return j.status === 'sent_to_uc' || j.status === 'remind' || j.status === 'self_pending'; });
  var h = '';
  open.slice(0, 3).forEach(function (j) {
    h += '<div class="card violet"><div class="muted">' + esc(j.date) + ' · ' + esc(j.title) + '</div><div class="ct">Is it fixed?</div>' +
      '<div class="row" style="flex-wrap:wrap">' +
      '<button class="chip" onclick="closeJob(\'' + j.id + '\',\'uc\')">Yes, Urban Company pro</button>' +
      '<button class="chip" onclick="closeJob(\'' + j.id + '\',\'other\')">Yes, someone else</button>' +
      '<button class="chip" onclick="closeJob(\'' + j.id + '\',\'self\')">Yes, we fixed it</button>' +
      '<button class="chip" onclick="notYet(\'' + j.id + '\')">Not yet</button></div></div>';
  });
  var has = S.text || S.audio || S.img;
  h += '<div style="text-align:center;display:flex;flex-direction:column;gap:2px;padding-top:8px"><h1>Kya hua hai?</h1><p class="sub">(What\'s not working?)</p></div>' +
    '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 4px">' +
    '<button id="micBtn" class="mic' + (S.listening ? ' live' : '') + '" onclick="micTap()" aria-label="Speak">' +
    (S.listening ? '<span class="stopsq"></span>' : '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>') +
    '</button>' +
    '<div class="muted" id="micHint" style="text-align:center">' + esc(S.micMsg || (S.listening ? 'Listening... tap again when you are done' : 'Tap and speak in English, Hindi or Hinglish')) + '</div></div>' +
    '<input id="rec" type="file" accept="audio/*" capture class="hide" onchange="pickAudio(this)">';
  if (S.typing) {
    h += '<textarea id="txt" placeholder="e.g. Bathroom ka tap tapak raha hai aur bedroom ka switch dheela hai">' + esc(S.text) + '</textarea>';
  } else if (S.text || S.listening) {
    h += '<div class="card grey" id="live"><div class="muted">You said</div><div id="liveTxt" style="font-size:15px;line-height:22px">' + esc(S.text) + '<span id="interim" style="color:#8A8A8A"></span></div>' +
      (S.text && !S.listening ? '<button class="btn link" style="text-align:left;padding:0" onclick="S.typing=true;home()">Edit text</button>' : '') + '</div>';
  }
  if (S.audio) h += '<div class="card grey"><div class="between"><span style="font-size:14px;font-weight:600">Voice note added</span><button class="btn link" style="width:auto" onclick="S.audio=null;home()">Remove</button></div><span class="muted">Ghar Diary will listen to it when you tap Help me check.</span></div>';
  if (S.imgUrl) h += '<img class="preview" src="' + S.imgUrl + '"><button class="btn link" onclick="clearPhoto()">Remove photo</button>';
  h += '<div class="row"><label class="btn sec sm" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F0F0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>' +
    (S.img ? 'Change photo' : 'Add a photo') + '<input id="ph" type="file" accept="image/*" class="hide" onchange="pickPhoto(this)"></label>' +
    (S.typing ? '' : '<button class="btn sec sm" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px" onclick="S.typing=true;home()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F0F0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Type instead</button>') + '</div>';
  if (has || S.typing) h += '<button class="btn" onclick="submit()">Help me check</button>';
  h += '<p class="muted">Nothing is booked or sent to anyone. What you share is saved without your name to improve this test, so please don\'t say names, phone numbers or addresses.</p>';
  V(h);
  if (S.typing) { var tx = document.getElementById('txt'); tx.oninput = function () { S.text = tx.value; }; }
}

function syncText() { var tx = document.getElementById('txt'); if (tx) S.text = tx.value; }

/* Voice: live transcription where the browser allows it, otherwise the phone's own recorder (Gemini listens to the file). */
var REC = null;
function micTap() {
  syncText();
  var R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (S.listening) { S.listening = false; var r0 = REC; REC = null; try { r0 && r0.stop(); } catch (e) {} home(); return; }
  if (!R || S.useRecorder) { document.getElementById('rec').click(); return; }
  try {
    REC = new R(); REC.lang = 'en-IN'; REC.interimResults = true; REC.continuous = true;
    var base = S.text ? S.text + ' ' : '';
    REC.onresult = function (e) {
      var fin = '', inter = '';
      for (var i = 0; i < e.results.length; i++) { if (e.results[i].isFinal) fin += e.results[i][0].transcript + ' '; else inter += e.results[i][0].transcript; }
      S.text = (base + fin).trim(); S.heardAny = true;
      var lt = document.getElementById('liveTxt'); if (lt) lt.innerHTML = esc(S.text) + ' <span style="color:#8A8A8A">' + esc(inter) + '</span>';
    };
    REC.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
        S.useRecorder = true; S.micMsg = 'Live listening is blocked here. Tap the mic again to record a voice note instead.';
      } else if (e.error === 'no-speech') { S.micMsg = 'I didn\'t hear anything. Tap the mic and try again.'; }
    };
    REC.onend = function () { if (!S.listening && !S.micMsg) return; S.listening = false; REC = null; home(); S.micMsg = ''; };
    S.heardAny = false;
    setTimeout(function () { if (S.listening && !S.heardAny && !S.text) { var mh = document.getElementById('micHint'); if (mh) mh.textContent = 'Not hearing you yet. Speak closer, or tap to stop and use Type instead.'; } }, 6000);
    S.listening = true; S.micMsg = ''; S.typing = false;
    home();
    REC.start();
    track('mic_live');
  } catch (e) { S.useRecorder = true; S.listening = false; document.getElementById('rec').click(); }
}
function pickAudio(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  if (f.size > 15 * 1024 * 1024) { alertBox('That recording is too long. Please keep it under a minute.'); return; }
  var r = new FileReader();
  r.onload = function () { S.audio = String(r.result).split(',')[1]; S.audioMime = f.type || 'audio/mp4'; track('mic_recorder'); home(); };
  r.readAsDataURL(f);
}

function pickPhoto(inp) {
  syncText();
  var f = inp.files && inp.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var im = new Image();
    im.onload = function () {
      var max = 1024, w = im.width, h = im.height, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      S.imgUrl = c.toDataURL('image/jpeg', 0.8); S.img = S.imgUrl.split(',')[1]; S.imgMime = 'image/jpeg';
      home();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}
function clearPhoto() { syncText(); S.img = S.imgUrl = null; home(); }

function submit() {
  syncText();
  if (REC) { try { REC.stop(); } catch (e) {} }
  S.text = (S.text || '').trim();
  if (!S.text && !S.img && !S.audio) { alertBox('Please tell us the problem or add a photo.'); return; }
  loading();
  var facts = D.facts.map(function (f) { return f.text; });
  api('diagnose', { input: { text: S.text, imageBase64: S.img, imageMime: S.imgMime, audioBase64: S.audio, audioMime: S.audioMime, homeFacts: facts } },
    function (r) {
      if (!r || !r.ok) { home(); alertBox((r && r.error) || 'Something went wrong. Please try again.'); return; }
      if (r.heard && !S.text) S.text = r.heard;
      S.result = r; S.tried = {}; S.answers = {}; S.status = {}; S.removed = {}; S.removedChoice = {};
      r.problems.forEach(function (p) { S.status[p.id] = p.risk === 'safe_to_try' ? 'pending' : 'needs_pro'; });
      track('diagnosed', { detail: r.problems.length + ' problems', trade: r.problems.map(function (p) { return p.trade; }).join(','), risk: r.problems.map(function (p) { return p.risk; }).join(',') });
      result();
    },
    function () { home(); alertBox('Could not reach Ghar Diary. Please check your internet and try again.'); });
}
function alertBox(msg) { var v = document.getElementById('view'); var d = document.createElement('div'); d.className = 'card red'; d.innerHTML = '<span class="redtxt">' + esc(msg) + '</span>'; v.insertBefore(d, v.firstChild); }

function loading() { V('<div style="padding:60px 0;display:flex;flex-direction:column;gap:14px;text-align:center"><div class="spin"></div><div class="ct">Loading...</div></div>'); }

function result() {
  var r = S.result, h = '';
  if (r.alert) h += '<div class="alert"><b>Safety first.</b> ' + esc(r.alert.text) + '</div>';
  if (!r.problems.length) {
    h += '<div class="card"><div class="ct">Tell me a bit more</div><div style="font-size:14px;line-height:20px">' + esc(r.clarifying_question || 'Which room, and what exactly is happening?') + '</div></div>' +
      '<button class="btn" onclick="home()">Add more detail</button>';
    V(h); return;
  }
  if (r.heard) h += '<div class="card grey"><div class="muted">You said</div><div style="font-size:14px;line-height:20px">' + esc(r.heard) + '</div></div>';
  h += '<div class="muted">I found <b>' + r.problems.length + ' problem' + (r.problems.length > 1 ? 's' : '') + '</b>. Try only what you\'re comfortable with.</div>';
  r.problems.forEach(function (p, i) {
    var red = p.risk !== 'safe_to_try';
    var badge = p.risk === 'urgent' ? '<span class="badge b-urg">Act now</span>' : red ? '<span class="badge b-no">Don\'t DIY</span>' : '<span class="badge b-safe">Safe to try</span>';
    h += '<div class="card' + (red ? ' red' : '') + '"><div class="between"><span class="ct">' + (i + 1) + '. ' + esc(p.title) + '</span>' + badge + '</div>' +
      '<div class="muted">' + esc(ROOM[p.room]) + (p.likely_cause ? ' · ' + esc(p.likely_cause) : '') + '</div>';
    if (red) {
      if (p.safety_note) h += '<div class="redtxt">' + esc(p.safety_note) + '</div>';
      h += '<div class="redtxt"><b>This one needs ' + (p.trade === 'other' ? 'a professional' : (/^[aeiou]/i.test(TRADE[p.trade]) ? 'an ' : 'a ') + (p.trade === 'ac' ? 'AC technician' : esc(TRADE[p.trade]).toLowerCase())) + '.</b></div>';
    } else {
      p.diy_steps.forEach(function (s) {
        h += '<label class="step"><input type="checkbox"><span>' + (s.only_if_easy ? '<b>Only if it\'s easy:</b> ' : '') + esc(s.step) + (s.only_if_easy ? ' Not comfortable? Skip it.' : '') + '</span></label>';
      });
      if (p.pro_needed_if) h += '<div class="muted">' + esc(p.pro_needed_if) + '</div>';
      var st = S.status[p.id];
      if (st === 'fixed_diy') h += '<div class="card grey"><span style="font-size:13px">Great, noted in your Ghar Diary. <button class="btn link" style="display:inline;padding:0" onclick="setStatus(\'' + p.id + '\',\'pending\')">Undo</button></span></div>';
      else h += '<div class="row"><button class="btn sec sm" style="flex:1" onclick="setStatus(\'' + p.id + '\',\'fixed_diy\')">It stopped, all good</button>' +
        '<button class="btn sm" style="flex:1' + (st === 'needs_pro' ? ';outline:3px solid #6E42E5' : '') + '" onclick="S.tried[\'' + p.id + '\']=true;setStatus(\'' + p.id + '\',\'needs_pro\')">Still there</button></div>' +
        '<button class="btn link" onclick="S.tried[\'' + p.id + '\']=false;setStatus(\'' + p.id + '\',\'needs_pro\')">Skip the checks, I\'d rather call a pro</button>';
    }
    if (p.optional_question && S.status[p.id] !== 'fixed_diy') {
      h += '<div class="card grey"><span style="font-size:13px"><b>Optional:</b> ' + esc(p.optional_question) + '</span><div class="row" style="flex-wrap:wrap">';
      p.optional_choices.concat(['Not sure']).forEach(function (c) {
        h += '<button class="chip' + (S.answers[p.id] === c ? ' on' : '') + '" onclick="answer(\'' + p.id + '\',this)">' + esc(c) + '</button>';
      });
      h += '<button class="btn link" style="width:auto" onclick="answer(\'' + p.id + '\',null)">Skip, I\'d rather not say</button></div></div>';
    }
    h += '</div>';
  });
  var need = r.problems.filter(function (p) { return S.status[p.id] !== 'fixed_diy'; }).length;
  h += need ? '<button class="btn" onclick="toJobs()">See my job list</button>' : '<button class="btn" onclick="finishAllFixed()">All fixed, save to Ghar Diary</button>';
  h += '<button class="btn link" onclick="S.text=\'\';S.audio=null;S.typing=false;S.img=S.imgUrl=null;home()">Start over</button>';
  V(h);
}
function setStatus(id, st) { S.status[id] = st; track(st === 'fixed_diy' ? 'fixed_by_diy' : 'needs_pro', { detail: id }); result(); }
function answer(id, el) { S.answers[id] = el ? el.textContent : null; result(); }

function finishAllFixed() {
  S.result.problems.forEach(function (p) { addJob(p, 'fixed_diy'); });
  saveFacts(); track('all_fixed_diy'); diary();
}
function toJobs() { S.result.problems.forEach(function (p) { if (S.status[p.id] === 'pending') S.status[p.id] = 'needs_pro'; }); track('job_list_viewed'); jobs(); }

function jobs() {
  var ps = S.result.problems.filter(function (p) { return S.status[p.id] === 'needs_pro'; });
  var h = '<div class="ct" style="font-size:18px">Your job list</div>';
  ps.forEach(function (p) {
    if (S.removed[p.id]) {
      var c = S.removedChoice[p.id];
      if (!c) h += '<div class="card violet"><span style="font-size:13px;font-weight:600">' + esc(p.title) + ' removed. Remind you about it tomorrow?</span><div class="row" style="flex-wrap:wrap">' +
        '<button class="chip" onclick="removeChoice(\'' + p.id + '\',\'remind\')">Yes, remind me</button><button class="chip" onclick="removeChoice(\'' + p.id + '\',\'self\')">I\'ll get it done myself</button>' +
        '<button class="btn link" style="width:auto" onclick="unremove(\'' + p.id + '\')">Add it back</button></div></div>';
      else h += '<div class="card grey"><div class="between"><span style="font-size:12px;line-height:17px">' + (c === 'remind' ? 'Okay. Next time you open Ghar Diary, it will ask about the ' + esc(p.title.toLowerCase()) + '.' : 'Got it. Ghar Diary will ask later if it got fixed, so your diary stays complete.') + '</span><button class="btn link" style="width:auto" onclick="unremove(\'' + p.id + '\')">Undo</button></div></div>';
      return;
    }
    var s = p.service;
    h += '<div class="card"><div class="between"><span style="font-size:14px;font-weight:600">' + esc(s.name) + '</span><button class="chip" onclick="removeJob(\'' + p.id + '\')">Not today</button></div>' +
      '<div class="muted">' + esc(p.title) + (S.answers[p.id] ? ' · ' + esc(p.optional_question) + ' ' + esc(S.answers[p.id]) : '') + '</div>' +
      (s.work ? '<div style="font-size:12px;color:#3B2A8F;font-weight:600">' + esc(s.work) + ' (estimate)</div>' : '') +
      (s.from ? '<div class="muted">' + esc(s.from) + ' on Urban Company\'s public page (checked 25 Nov 2026)</div>' : '') +
      '<button class="btn sm" onclick="openUC(\'' + p.id + '\')">' + (p.service_id === 'none' ? 'Search on Urban Company' : 'Open on Urban Company') + '</button></div>';
  });
  h += '<div class="muted">Spare parts, if a part needs replacing, cost extra as per Urban Company\'s rate card.</div>' +
    '<div class="card grey"><span class="muted"><b>In the full feature</b> you would pick a date, time and professional here and pay in Urban Company\'s usual checkout. This test version only opens Urban Company\'s public page. It never books for you.</span></div>' +
    '<button class="btn" onclick="brief()">Get the briefing for the professional</button>' +
    '<button class="btn link" onclick="saveLater()">Not now, save to Ghar Diary</button>';
  V(h);
}
function removeJob(id) { S.removed[id] = true; S.removedChoice[id] = null; track('not_today', { detail: id }); jobs(); }
function unremove(id) { S.removed[id] = false; S.removedChoice[id] = null; jobs(); }
function removeChoice(id, c) { S.removedChoice[id] = c; track('removed_' + c, { detail: id }); jobs(); }
function openUC(id) {
  var p = S.result.problems.filter(function (x) { return x.id === id; })[0];
  track('book_click', { trade: p.trade, risk: p.risk, detail: p.service_id });
  p.clicked = true;
  window.open(p.service.url, '_blank');
}

function briefText() {
  var ps = S.result.problems.filter(function (p) { return S.status[p.id] === 'needs_pro' && !S.removed[p.id]; });
  var t = 'Hi, here is what is happening at home:\n';
  ps.forEach(function (p, i) {
    t += '\n' + (i + 1) + '. ' + p.title + ' (' + ROOM[p.room] + ')\n';
    if (p.evidence) t += '   In my words: "' + p.evidence + '"\n';
    if (S.tried[p.id]) t += '   Already tried the simple checks; still there.\n';
    if (p.risk === 'urgent') t += '   Switched off for safety.\n';
    if (S.answers[p.id] && S.answers[p.id] !== 'Not sure') t += '   ' + p.optional_question + ' ' + S.answers[p.id] + '\n';
  });
  var facts = D.facts.map(function (f) { return f.text; });
  if (facts.length) t += '\nAbout my home (shared by me): ' + facts.join('; ') + '\n';
  t += '\nSent from Ghar Diary (test).';
  return t;
}
function brief() {
  var t = briefText();
  track('briefing_viewed');
  V('<div class="ct" style="font-size:18px">Briefing for the professional</div>' +
    '<div class="muted">Only what you told Ghar Diary. Nothing else is shared, and nothing is sent unless you send it.</div>' +
    '<div class="card"><pre id="bt">' + esc(t) + '</pre></div>' +
    '<div class="row"><button class="btn sec" style="flex:1" onclick="copyBrief()">Copy</button>' +
    '<a class="btn" style="flex:1" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(t) + '" onclick="track(\'briefing_shared\')">Share on WhatsApp</a></div>' +
    '<button class="btn sec" onclick="done()">Done, save to Ghar Diary</button>' +
    '<button class="btn link" onclick="jobs()">Back to job list</button>');
}
function copyBrief() {
  var t = document.getElementById('bt').textContent;
  function fallback() { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }
  try { navigator.clipboard.writeText(t).catch(fallback); } catch (e) { fallback(); }
  track('briefing_copied'); alertBox('Copied. Paste it in the chat with your professional after booking.');
}

/* ---------- diary ---------- */
function addJob(p, status) {
  D.jobs.unshift({ id: 'j' + Date.now() + p.id, date: today(), ts: Date.now(), title: p.title, room: p.room, trade: p.trade, status: status, outcome: status === 'fixed_diy' ? 'Fixed with the simple checks' : '', tried: !!S.tried[p.id] });
}
function saveFacts() {
  S.result.problems.forEach(function (p) {
    var a = S.answers[p.id];
    if (a && a !== 'Not sure') D.facts.push({ text: p.optional_question.replace(/\?$/, '') + ': ' + a, room: p.room, source: 'Told by you', date: today() });
  });
  save(D);
}
function done() {
  S.result.problems.forEach(function (p) {
    var st = S.status[p.id];
    if (st === 'fixed_diy') addJob(p, 'fixed_diy');
    else if (S.removed[p.id]) addJob(p, S.removedChoice[p.id] === 'self' ? 'self_pending' : 'remind');
    else addJob(p, p.clicked ? 'sent_to_uc' : 'remind');
  });
  saveFacts(); track('saved_to_diary'); S.text = ''; S.audio = null; S.typing = false; S.img = S.imgUrl = null; diary();
}
function saveLater() {
  S.result.problems.forEach(function (p) { addJob(p, S.status[p.id] === 'fixed_diy' ? 'fixed_diy' : 'remind'); });
  saveFacts(); track('saved_for_later'); S.text = ''; S.audio = null; S.typing = false; diary();
}
function closeJob(id, who) {
  D.jobs.forEach(function (j) { if (j.id === id) { j.status = 'closed'; j.outcome = { uc: 'Fixed by an Urban Company professional', other: 'Fixed by someone else', self: 'Fixed by us' }[who]; j.closed = today(); } });
  save(D); track('followup_' + who); home();
}
function notYet(id) {
  var j = D.jobs.filter(function (x) { return x.id === id; })[0];
  track('followup_not_yet'); S.text = j ? j.title : ''; home();
}
var LABEL = { fixed_diy: 'Fixed with the simple checks', sent_to_uc: 'Opened on Urban Company · not closed yet', remind: 'Waiting · we will ask you', self_pending: 'You are handling it', closed: '' };
function diary() {
  var h = '<div class="ct" style="font-size:18px">My Ghar Diary</div>' +
    '<div class="card grey"><div class="between"><div><div style="font-size:13px;font-weight:700">Only on this phone</div><div class="muted">Sharing with family or your landlord comes in the full version.</div></div></div></div>';
  h += '<div class="tabs">' + ['room', 'visit', 'pro'].map(function (t) { return '<button class="' + (S.tab === t ? 'on' : '') + '" onclick="S.tab=\'' + t + '\';diary()">' + { room: 'By room', visit: 'By visit', pro: 'By professional' }[t] + '</button>'; }).join('') + '</div>';
  if (!D.jobs.length && !D.facts.length) {
    h += '<div class="card grey"><span class="muted">Your diary is empty for now. Ghar Diary only remembers what you choose to tell it. Nothing is collected in the background.</span></div>';
  } else {
    var groups = {};
    function put(k, html) { (groups[k] = groups[k] || []).push(html); }
    D.jobs.forEach(function (j) {
      var line = '<div class="item"><span><b>' + esc(j.title) + '</b><br><span class="muted">' + esc(j.outcome || LABEL[j.status]) + '</span></span><span>' + esc(j.closed || j.date) + '</span></div>';
      if (S.tab === 'room') put(ROOM[j.room] || 'Other', line);
      else if (S.tab === 'pro') put(TRADE[j.trade] || 'Other', line);
      else put(j.date, line);
    });
    if (S.tab === 'room') D.facts.forEach(function (f) { put(ROOM[f.room] || 'Other', '<div class="item"><span>' + esc(f.text) + '</span><span>' + esc(f.source) + '</span></div>'); });
    Object.keys(groups).forEach(function (k) { h += '<div class="card"><div class="ct">' + esc(k) + '</div>' + groups[k].join('') + '</div>'; });
  }
  h += '<button class="btn" onclick="home()">Something not working? Tell Ghar Diary</button>' +
    (D.jobs.length || D.facts.length ? '<button class="btn link" onclick="if(confirm(\'Delete everything in this diary?\')){D={facts:[],jobs:[]};save(D);diary();}">Delete my diary</button>' : '');
  V(h);
}

home();
</script>
</body>
</html>
